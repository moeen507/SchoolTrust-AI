<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6f1026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>UMEED Education System — Fee Ledger</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toast" class="toast hidden"></div>
<div id="modalRoot" class="modalRoot hidden"></div>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="icon.svg" alt="UMEED">
      <div><h1>UMEED</h1><p>Education System</p></div>
    </div>
    <div class="productTag">Premium Fee Ledger</div>
    <nav id="nav"></nav>
    <div class="syncBox">
      <div class="syncRow"><span>Cloud Sync</span><b id="pendingBadge">0</b></div>
      <div id="syncStatus" class="syncStatus">Local-first / checking</div>
      <button class="ghost" data-action="sync-now">Sync Pending Data</button>
      <button class="ghost" data-action="settings">Settings</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><p class="eyebrow">UMEED Education System</p><h2 id="pageTitle">Dashboard</h2><p id="pageSub">Premium school fee and student management</p></div>
      <div class="topActions">
        <button class="secondary" data-action="export-backup">Backup</button>
        <button class="secondary" data-action="import-backup">Restore</button>
        <button class="primary" data-action="open-fee">+ Add Fee</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>
<input id="backupInput" type="file" accept="application/json" hidden>
<input id="csvInput" type="file" accept=".csv,text/csv" hidden>
<script src="app.js"></script>
</body></html>
