<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B10515">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UMEED Education System — Premium Fee Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="appShell">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <img src="icon.svg" alt="UMEED">
      <div><strong>UMEED</strong><span>EDUCATION SYSTEM</span></div>
    </div>
    <div class="yearBadge">Premium Fee Ledger <b id="yearBadge"></b></div>
    <nav id="nav"></nav>
    <div class="syncCard">
      <div class="syncLabel">LOCAL-FIRST</div>
      <div id="syncStatus">Checking Supabase…</div>
      <div id="pendingSync" class="syncCount">0 changes pending</div>
      <button class="btn gold full" data-action="sync-now">Sync Pending Data</button>
    </div>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <div class="topTitle">
        <button id="mobileMenu" class="iconBtn">☰</button>
        <div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Premium school fee management</p></div>
      </div>
      <div class="topActions">
        <button class="btn" data-action="backup">Backup</button>
        <button class="btn gold" data-action="open-fee">+ Fee Entry</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="modalRoot" class="modalRoot hidden"></div>
<div id="toast" class="toast hidden"></div>
<input id="filePicker" type="file" class="hidden">
<script src="vendor/xlsx.full.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
