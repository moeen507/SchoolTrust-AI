plugins {
    id 'com.android.application'
}

android {
    namespace 'com.umeed.peopleos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.umeed.peopleos'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '5.9.2-R12'
    }

    def ksPath = System.getenv('PEOPLEOS_KEYSTORE_FILE')
    if (ksPath) {
        signingConfigs {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('PEOPLEOS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PEOPLEOS_KEY_ALIAS') ?: 'peopleos'
                keyPassword System.getenv('PEOPLEOS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (ksPath) signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
