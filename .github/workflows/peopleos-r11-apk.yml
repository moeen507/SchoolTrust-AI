name: Build PeopleOS R11 APK

on:
  push:
    branches: [ peopleos-apk-build-r11 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: peopleos-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Build installable APK
        run: "$RUNNER_TEMP/gradle-8.9/bin/gradle --no-daemon clean assembleRelease"

      - name: Collect APK and signing key
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/PeopleOS-v5.9.2-R11.apk
          cp "$HOME/.android/debug.keystore" artifact/PeopleOS-R11-signing.keystore
          printf '%s\n' \
            'Signing key: PeopleOS-R11-signing.keystore' \
            'Alias: androiddebugkey' \
            'Store password: android' \
            'Key password: android' \
            '' \
            'Keep this keystore. Future APK updates must use this same signing key.' \
            > artifact/PeopleOS-R11-signing-info.txt
          ls -lh artifact/

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: PeopleOS-v5.9.2-R11-Install-Package
          path: peopleos-apk/artifact/*
          if-no-files-found: error
          retention-days: 30
