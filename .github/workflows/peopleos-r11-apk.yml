name: PeopleOS Runner Probe

on:
  push:
    branches: [ peopleos-apk-build-r11 ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe runner
        run: |
          echo "runner works"
          uname -a
          java -version || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          command -v gradle || true
